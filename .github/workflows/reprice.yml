name: Daily re-price

# Re-price the tracker to the last completed trading day, every weekday
# after market close. 22:30 UTC is 17:30 EST (18:30 EDT in summer), after
# the 16:00 ET close. Runs on GitHub's servers, so no Muse re-price and no
# push approval is needed. The script is idempotent: if there is no new
# close (weekend, market holiday, or Yahoo has not published the close
# yet) it changes nothing and the job commits nothing.
# `workflow_dispatch` lets the re-price be run by hand from the Actions tab.
on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

# The job must be allowed to push its own commit. If the push fails with a
# 403, check the repo's Settings > Actions > General > Workflow
# permissions and set it to "Read and write permissions".
permissions:
  contents: write

jobs:
  reprice:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Re-price to the latest close
        id: reprice
        run: python3 scripts/reprice.py

      - name: Commit and push if changed
        run: |
          git config user.name "podcast-stocks-bot"
          git config user.email "podcast-stocks-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes — already current."
          else
            git commit -m "Re-price to ${{ steps.reprice.outputs.target_date }} close (SPY ${{ steps.reprice.outputs.spy_close }})"
            git push
          fi
